<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040F1D"/>
      <stop offset="50%" stop-color="#061525"/>
      <stop offset="100%" stop-color="#0A1D33"/>
    </linearGradient>

    <!-- Saffron Orange Hand Gradient -->
    <linearGradient id="saffronHand" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFA84A"/>
      <stop offset="60%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#E66A00"/>
    </linearGradient>

    <!-- India Green Hand Gradient -->
    <linearGradient id="greenHand" x1="0%" y1="100%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#24B314"/>
      <stop offset="50%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#0D5C05"/>
    </linearGradient>

    <!-- Tricolour G Gradient -->
    <linearGradient id="tricolourG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="42%" stop-color="#FF9933"/>
      <stop offset="48%" stop-color="#FFFFFF"/>
      <stop offset="52%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>

    <!-- Sleek Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Divider Line Gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Navy Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glow Behind Emblem -->
  <circle cx="115" cy="100" r="75" fill="#000080" opacity="0.35" filter="url(#softGlow)"/>

  <!-- ==================== EMBLEM (LEFT) ==================== -->
  <g id="emblem-group" transform="translate(15, 0)">
    <!-- Central Ashoka Chakra Base Disc -->
    <circle cx="100" cy="100" r="34" fill="#FFFFFF"/>
    <circle cx="100" cy="100" r="33" stroke="#000080" stroke-width="2.2" fill="#FFFFFF"/>

    <!-- Ashoka Chakra Inner Hub -->
    <circle cx="100" cy="100" r="7.5" fill="#000080"/>
    <circle cx="100" cy="100" r="3" fill="#FFFFFF"/>

    <!-- 24 Ashoka Chakra Spokes -->
    <g id="chakra-spokes" stroke="#000080" stroke-width="1.3" stroke-linecap="round">
      <!-- 24 Spokes spaced at 15 degrees -->
      <line x1="100" y1="100" x2="100" y2="68"/>
      <line x1="100" y1="100" x2="108.28" y2="69.11"/>
      <line x1="100" y1="100" x2="116" y2="72.32"/>
      <line x1="100" y1="100" x2="122.63" y2="77.37"/>
      <line x1="100" y1="100" x2="127.68" y2="84"/>
      <line x1="100" y1="100" x2="130.89" y2="91.72"/>
      <line x1="100" y1="100" x2="132" y2="100"/>
      <line x1="100" y1="100" x2="130.89" y2="108.28"/>
      <line x1="100" y1="100" x2="127.68" y2="116"/>
      <line x1="100" y1="100" x2="122.63" y2="122.63"/>
      <line x1="100" y1="100" x2="116" y2="127.68"/>
      <line x1="100" y1="100" x2="108.28" y2="130.89"/>
      <line x1="100" y1="100" x2="100" y2="132"/>
      <line x1="100" y1="100" x2="91.72" y2="130.89"/>
      <line x1="100" y1="100" x2="84" y2="127.68"/>
      <line x1="100" y1="100" x2="77.37" y2="122.63"/>
      <line x1="100" y1="100" x2="72.32" y2="116"/>
      <line x1="100" y1="100" x2="69.11" y2="108.28"/>
      <line x1="100" y1="100" x2="68" y2="100"/>
      <line x1="100" y1="100" x2="69.11" y2="91.72"/>
      <line x1="100" y1="100" x2="72.32" y2="84"/>
      <line x1="100" y1="100" x2="77.37" y2="77.37"/>
      <line x1="100" y1="100" x2="84" y2="72.32"/>
      <line x1="100" y1="100" x2="91.72" y2="69.11"/>
    </g>

    <!-- Ashoka Chakra Outer Ring Dots (Gems) -->
    <circle cx="100" cy="100" r="31.5" stroke="#000080" stroke-width="0.8" stroke-dasharray="1.2, 2.9" fill="none"/>

    <!-- Upper Hand / Arc (Saffron - Welcoming Flow) -->
    <path d="M 40,100 C 38,62 65,34 105,32 C 138,30 162,48 168,76 C 160,70 148,66 136,66 C 114,66 100,74 92,86 C 88,81 81,77 72,78 C 58,80 50,90 48,100 Z" 
          fill="url(#saffronHand)" opacity="0.98"/>
    <!-- Stylized Finger Arcs for Saffron Hand -->
    <path d="M 105,32 C 126,32 154,46 166,66 C 158,62 144,60 134,62 C 112,66 104,78 94,88 C 84,72 66,60 48,68 C 62,46 82,32 105,32 Z" 
          fill="#FFA84A" opacity="0.3"/>
    <path d="M 134,62 C 146,62 158,67 166,74 C 158,78 146,80 136,78 C 122,76 112,68 106,62 Z" 
          fill="#FFB366" opacity="0.85"/>

    <!-- Lower Hand / Arc (India Green - Supporting Flow) -->
    <path d="M 160,100 C 162,138 135,166 95,168 C 62,170 38,152 32,124 C 40,130 52,134 64,134 C 86,134 100,126 108,114 C 112,119 119,123 128,122 C 142,120 150,110 152,100 Z" 
          fill="url(#greenHand)" opacity="0.98"/>
    <!-- Stylized Finger Arcs for Green Hand -->
    <path d="M 95,168 C 74,168 46,154 34,134 C 42,138 56,140 66,138 C 88,134 96,122 106,112 C 116,128 134,140 152,132 C 138,154 118,168 95,168 Z" 
          fill="#2CD81A" opacity="0.3"/>
    <path d="M 66,138 C 54,138 42,133 34,126 C 42,122 54,120 64,122 C 78,124 88,132 94,138 Z" 
          fill="#34E822" opacity="0.85"/>
  </g>

  <!-- ==================== VERTICAL DIVIDER ==================== -->
  <line x1="225" y1="42" x2="225" y2="158" stroke="url(#dividerGrad)" stroke-width="2"/>

  <!-- ==================== WORDMARK (RIGHT) ==================== -->
  <g id="wordmark-group" transform="translate(255, 0)">
    <!-- SWAGAT Letters -->
    <g font-family="'Inter', 'Montserrat', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
       font-weight="900" 
       font-size="74" 
       letter-spacing="4">
      
      <!-- S -->
      <text x="0" y="112" fill="#FFFFFF">S</text>
      <!-- W -->
      <text x="56" y="112" fill="#FFFFFF">W</text>
      <!-- A -->
      <text x="146" y="112" fill="#FFFFFF">A</text>
      
      <!-- G with Tricolour Gradient Fill -->
      <text x="210" y="112" fill="url(#tricolourG)">G</text>
      
      <!-- A -->
      <text x="278" y="112" fill="#FFFFFF">A</text>
      <!-- T -->
      <text x="342" y="112" fill="#FFFFFF">T</text>
    </g>

    <!-- Tagline: India's Single Window Gateway -->
    <text x="4" y="152" 
          font-family="'Inter', 'Montserrat', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="18.5" 
          font-weight="500" 
          fill="#94A3B8" 
          letter-spacing="3.2">
      India’s Single Window Gateway
    </text>

    <!-- Tiny Tricolour Underline Accent -->
    <rect x="4" y="166" width="70" height="2.5" rx="1.25" fill="#FF9933"/>
    <rect x="76" y="166" width="30" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.9"/>
    <rect x="108" y="166" width="70" height="2.5" rx="1.25" fill="#138808"/>
  </g>
</svg>
