<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/swagat-emblem-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWAGAT — India's Single Window Approval Gateway</title>
    <meta name="description" content="SWAGAT is India's modern digital single-window platform for discovering, understanding, applying for and tracking business &amp; government approvals across Central ministries and 28 States." />

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!--
      CRITICAL: Synchronous theme-anti-flash script.
      Runs BEFORE any CSS paint or React render.
      Reads saved theme from localStorage and immediately:
        1. Adds correct class ('dark' or 'light') to <html>
        2. Adds 'splash-active' class to lock overflow during splash
        3. Sets background so the very first painted pixel is already
           the correct splash background color.
      This eliminates FOUC / black-flash / glow-circle / wrong-theme-flash.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('swagat_theme');
          var t = (saved === 'dark' || saved === 'light') ? saved : 'light';
          var el = document.documentElement;
          el.classList.remove('dark', 'light');
          el.classList.add(t);
          el.classList.add('splash-active');
          var bg = t === 'dark' ? '#071A2D' : '#FFFFFF';
          el.style.backgroundColor = bg;
        } catch (e) {
          document.documentElement.classList.add('light');
          document.documentElement.classList.add('splash-active');
        }
      })();
    </script>

    <!-- Splash style active during splash only -->
    <style id="splash-init-style">
      html.splash-active, html.splash-active body {
        overflow: hidden !important;
      }
      /* Light splash base */
      html.light, html.light body { background-color: #FFFFFF !important; }
      /* Dark splash base */
      html.dark, html.dark body   { background-color: #071A2D !important; }
    </style>
  </head>
  <body class="font-sans antialiased selection:bg-amber-400/30 selection:text-[#07182C]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
