services:
  - type: web
    name: swagat-backend
    env: go
    rootDir: swagat-backend-main
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set to your Supabase connection string in Render Dashboard
